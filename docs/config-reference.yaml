# Retri Config Reference
#
# Priority chain (low → high):
#   defaults < groups < device_types < hosts < CLI flags
# RETRI_SSH_PASSWORD / RETRI_SSH_SECRET apply only when config is unset.
#
# Commands are AGGREGATED across all layers (not overridden).
# suffix is read from defaults / groups (+ CLI); filename/timestamp format from defaults (+ CLI).
#
# ${VAR} in legacy password/secret and literal credential value is expanded from environment variables at runtime.
#
# Legend:
#   [required] must be specified
#   [optional] can be omitted
#   default: value shown when omitted

# ===========================================================================
# credentials — optional named credential definitions
#
# A named credential can be referenced by password_credential or
# secret_credential from defaults / device_types / groups / hosts. This lets
# many hosts share one prompt or external secret source without duplicating the
# secret itself in config.
#
# Supported providers:
#   prompt     hidden terminal prompt (one prompt per named credential per run)
#   env        environment variable named by ref
#   literal    value from value (mainly for migration/testing; plaintext is discouraged)
#   keyring    existing Linux session keyring user key named by ref (native Linux API)
#   bitwarden  Bitwarden CLI item named by ref; works with Bitwarden or Vaultwarden
#              depending on `bw config server` (requires bw and an unlocked vault)
#
# Examples (do not put real secrets in this file):
#   prompt:
#     provider: prompt
#     prompt: "Shared SSH password"
#   env:
#     provider: env
#     ref: RETRI_SSH_PASSWORD
#   keyring:
#     provider: keyring
#     ref: retri-linux-sudo
#   bitwarden:
#     provider: bitwarden
#     server: https://pass.example.com
#     account: "BITWARDEN-USER-ID" # bw status userId, not email
#     ref: "BITWARDEN-ITEM-ID"
#     field: password              # password, username, or custom field
#   literal:
#     provider: literal
#     value: "migration-only-value" # plaintext; avoid in production
#
# Optional cache backend:
#   none             default; only the in-process cache is used
#   session-keyring  Linux session keyring cache (native Linux API). The cached
#                    value can survive multiple retri invocations in the same
#                    login session and can be used while the upstream provider
#                    is unavailable. Default TTL: 8h; allowed 1s..24h. TTL limits reuse by later runs.
# Cache errors fail explicitly; no provider fallback. See docs/credentials.md
# for profile binding, refresh/clear, permissions and snapshot semantics.
# ===========================================================================
credentials:
  linux-sudo:
    provider: prompt
    prompt: "Linux sudo password"       # [optional] prompt label
    cache:
      backend: session-keyring
      ttl: 8h

  network-login:
    provider: bitwarden
    server: https://vault.bitwarden.com  # must match bw status serverUrl
    account: "BITWARDEN-USER-ID"          # bw status userId (not email)
    ref: "BITWARDEN-ITEM-ID"            # [required for bitwarden]
    field: password                      # [optional] password (default), username, or custom field name
    cache:
      backend: session-keyring
      ttl: 8h

  # A second named credential can be used for sudo or enable secret.
  enable-secret:
    provider: prompt
    prompt: "Enable secret"

  from-env:
    provider: env
    ref: RETRI_NETWORK_PASSWORD

  existing-keyring-entry:
    provider: keyring
    ref: my-existing-key-description

# ===========================================================================
# defaults — global fallback applied to all hosts
# ===========================================================================
defaults:
  # --- CommonFields (shared with device_types / groups / hosts) ---
  user: ""                  # [optional] default: current OS user (passed to ssh as-is)
  password: ""              # [optional] default: none  — SSH password. Prefer ${VAR} or key auth
  password_credential: "" # [optional] named credential; exclusive with password in this layer
  secret: ""                # [optional] default: none  — sudo / enable secret. Prefer ${VAR}
  secret_credential: ""   # [optional] named credential; exclusive with secret in this layer
  command: ""               # [optional] default: none  — single command (ignored if commands is set)
  commands: []              # [optional] default: []    — list of commands to run
  command_file: ""          # [optional] default: none  — path to file with commands (one per line)
  log_dir: "~/retri-logs"   # [optional] default: ~/retri-logs
  log_encoding: "raw"       # [optional] default: raw — preserve rendered text bytes, or convert a known source encoding to UTF-8
                            #   raw, utf-8, shift_jis (CP932/Windows-31J), euc-jp,
                            #   iso-8859-1, windows-1252, gb18030, gbk, big5, euc-kr
                            #   malformed rendered lines retain pre-conversion bytes in the same .log; no .raw sidecar is created
  prompt_timeout: 300       # [optional] default: 300   — seconds to wait for prompt (interactive only)

  # --- defaults-only fields ---
  device_type: "linux"      # [optional] default: linux — fallback device type for all hosts
  parallel: "auto"          # [optional] default: 5     — concurrent executions. "auto"=num CPUs or a number
  timestamp: true           # [optional] default: true  — prefix each log line with a timestamp
  update_check: true        # [optional] default: true  — check GitHub Releases once per day and notify if newer
  log_commands_only: false  # [optional] default: false — session logs contain only submitted commands and their output
  filename_format: "{host}_{timestamp}{suffix}.log"  # [optional] default: as shown. vars: {host} {timestamp} {suffix}
  timestamp_format: "YYYYMMDD_HHmmss"                # [optional] default: as shown. format for {timestamp} in filename_format
                                                     #   symbols: YYYY MM DD HH mm ss
  suffix: ""                # [optional] default: none  — appended to {suffix} in filename_format

# ===========================================================================
# device_types — reusable profiles for interactive (PTY) devices
#                applied after defaults / groups, before hosts
# ===========================================================================
device_types:
  my_device:            # key name — referenced via device_type in defaults / groups / hosts
    # --- CommonFields ---
    user: ""            # [optional] default: none
    password: ""        # [optional] default: none
    password_credential: "" # [optional] named credential; exclusive with password in this layer
    secret: ""          # [optional] default: none
    secret_credential: ""   # [optional] named credential; exclusive with secret in this layer
    command: ""         # [optional] default: none
    commands: []        # [optional] default: []
    command_file: ""    # [optional] default: none
    log_dir: ""         # [optional] default: inherit from defaults
    log_encoding: ""    # [optional] default: inherit from defaults
    prompt_timeout: 0   # [optional] default: inherit from defaults (0 = inherit)

    # --- device_types-only fields ---
    prompt_regex: "[#>] ?$"    # [optional] default: [#>] ?$  — regex to detect CLI prompt
    setup_commands: []         # [optional] default: []       — sent once at session start
    exit_command: "exit"       # [optional] default: exit     — command to close the session

# ===========================================================================
# groups — apply shared settings to multiple hosts
#          applied after defaults, before device_types and hosts
# ===========================================================================
groups:
  - name: "my_group"    # [required] — referenced via groups: [...] in hosts, or -g CLI flag

    # --- CommonFields ---
    user: ""            # [optional] default: none
    password: ""        # [optional] default: none
    password_credential: "" # [optional] named credential; exclusive with password in this layer
    secret: ""          # [optional] default: none
    secret_credential: ""   # [optional] named credential; exclusive with secret in this layer
    command: ""         # [optional] default: none
    commands: []        # [optional] default: []
    command_file: ""    # [optional] default: none
    log_dir: ""         # [optional] default: inherit from defaults
    log_encoding: ""    # [optional] default: inherit from defaults
    prompt_timeout: 0   # [optional] default: inherit from defaults (0 = inherit)

    # --- groups-only fields ---
    device_type: ""     # [optional] default: none — override device_type for hosts in this group
    suffix: ""          # [optional] default: none — overrides defaults.suffix for this group's logs
    hosts: []           # [optional] default: []   — hostnames / ranges (e.g. "sw-[01-03]") in this group

# ===========================================================================
# hosts — individual host definitions (highest config priority)
# ===========================================================================
hosts:
  - host: "myhost"      # [required] — hostname, IP, or SSH config alias.
                        #   Range syntax: "sw-[01-03]" expands to sw-01, sw-02, sw-03

    # --- CommonFields ---
    user: ""            # [optional] default: none
    password: ""        # [optional] default: none
    password_credential: "" # [optional] named credential; exclusive with password in this layer
    secret: ""          # [optional] default: none
    secret_credential: ""   # [optional] named credential; exclusive with secret in this layer
    command: ""         # [optional] default: none
    commands: []        # [optional] default: []
    command_file: ""    # [optional] default: none
    log_dir: ""         # [optional] default: inherit from defaults
    log_encoding: ""    # [optional] default: inherit from defaults
    prompt_timeout: 0   # [optional] default: inherit from defaults (0 = inherit)

    # --- hosts-only fields ---
    device_type: ""     # [optional] default: none — override device_type for this host
    groups: []          # [optional] default: []   — group names this host belongs to
